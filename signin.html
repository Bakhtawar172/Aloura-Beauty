<!-- SIGN IN SECTION -->
<section class="min-h-[80vh] flex items-center justify-center px-6 py-16">

    <div class="w-full max-w-md">

        <!-- Heading -->
        <div class="text-center mb-8">

            <p class="uppercase tracking-[0.25em] text-sm text-[#8B6FAE] mb-3">
                WELCOME BACK
            </p>

            <h1 class="text-4xl md:text-5xl font-semibold">
                Sign in to Aloura
            </h1>

            <p class="text-gray-600 mt-4">
                Continue your beauty journey with us.
            </p>

        </div>


        <!-- Flowbite-style Card -->
        <div class="bg-white border border-[#E6DDEA] rounded-3xl shadow-sm p-8">

            <form class="space-y-6">


                <!-- Email Input -->
                <div>

                    <label for="email"
                           class="block mb-2 text-sm font-semibold">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                        class="block w-full px-4 py-3 bg-[#FAF7FC] border border-[#E6DDEA] rounded-xl text-sm focus:ring-2 focus:ring-[#B982AD] focus:border-[#6F5685] outline-none">

                </div>


                <!-- Password Input -->
                <div>

                    <label for="password"
                           class="block mb-2 text-sm font-semibold">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        class="block w-full px-4 py-3 bg-[#FAF7FC] border border-[#E6DDEA] rounded-xl text-sm focus:ring-2 focus:ring-[#B982AD] focus:border-[#6F5685] outline-none">

                </div>


                <!-- Remember + Forgot -->
                <div class="flex items-center justify-between">

                    <div class="flex items-center gap-2">

                        <input
                            id="remember"
                            type="checkbox"
                            class="w-4 h-4 accent-[#6F5685]">

                        <label for="remember"
                               class="text-sm text-gray-600">
                            Remember me
                        </label>

                    </div>

                    <a href="#"
                       class="text-sm text-[#6F5685] hover:underline">
                        Forgot password?
                    </a>

                </div>


                <!-- Sign In Button -->
                <button
                    type="submit"
                    class="w-full bg-[#6F5685] text-white py-3.5 rounded-xl font-semibold hover:bg-[#59436D] transition">
                    Sign In
                </button>


                <!-- Divider -->
                <div class="flex items-center gap-4">

                    <div class="h-px bg-[#E6DDEA] flex-1"></div>

                    <span class="text-sm text-gray-400">
                        or
                    </span>

                    <div class="h-px bg-[#E6DDEA] flex-1"></div>

                </div>


                <!-- Continue Button -->
                <button
                    type="button"
                    class="w-full border border-[#E6DDEA] text-[#6F5685] py-3 rounded-xl font-semibold hover:bg-[#E9DDF2] transition">
                    Continue with Email
                </button>

            </form>


            <!-- Sign Up Link -->
            <p class="text-center text-sm text-gray-600 mt-6">

                Don't have an account?

                <a href="signup.html"
                   class="text-[#6F5685] font-semibold hover:underline">
                    Sign up
                </a>

            </p>

        </div>

    </div>

</section>
