<!-- SIGN UP SECTION -->
<section class="min-h-[80vh] flex items-center justify-center px-6 py-16">

    <div class="w-full max-w-lg">

        <!-- Heading -->
        <div class="text-center mb-8">

            <p class="uppercase tracking-[0.25em] text-sm text-[#8B6FAE] mb-3">
                JOIN ALOURA
            </p>

            <h1 class="text-4xl md:text-5xl font-semibold text-[#29232D]">
                Create your account
            </h1>

            <p class="text-gray-600 mt-4">
                Start your beauty journey with Aloura.
            </p>

        </div>


        <!-- Card -->
        <div class="bg-white border border-[#E6DDEA] rounded-3xl shadow-sm p-8">

            <form class="space-y-5">

                <!-- Name -->
                <div>
                    <label for="name"
                           class="block mb-2 text-sm font-semibold">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Your name"
                        required
                        class="block w-full px-4 py-3 border border-[#E6DDEA] rounded-xl bg-[#FAF7FC] focus:ring-2 focus:ring-[#B982AD] focus:border-[#6F5685] outline-none">
                </div>


                <!-- Email -->
                <div>
                    <label for="email"
                           class="block mb-2 text-sm font-semibold">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                        class="block w-full px-4 py-3 border border-[#E6DDEA] rounded-xl bg-[#FAF7FC] focus:ring-2 focus:ring-[#B982AD] focus:border-[#6F5685] outline-none">
                </div>


                <!-- Password -->
                <div>
                    <label for="password"
                           class="block mb-2 text-sm font-semibold">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                        class="block w-full px-4 py-3 border border-[#E6DDEA] rounded-xl bg-[#FAF7FC] focus:ring-2 focus:ring-[#B982AD] focus:border-[#6F5685] outline-none">
                </div>


                <!-- Confirm Password -->
                <div>
                    <label for="confirm-password"
                           class="block mb-2 text-sm font-semibold">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Repeat your password"
                        minlength="6"
                        required
                        class="block w-full px-4 py-3 border border-[#E6DDEA] rounded-xl bg-[#FAF7FC] focus:ring-2 focus:ring-[#B982AD] focus:border-[#6F5685] outline-none">
                </div>


                <!-- Checkbox -->
                <div class="flex items-start gap-3">

                    <input
                        id="terms"
                        type="checkbox"
                        required
                        class="w-4 h-4 mt-1 accent-[#6F5685]">

                    <label for="terms" class="text-sm text-gray-600">
                        I agree to the Aloura terms and conditions.
                    </label>

                </div>


                <!-- Button -->
                <button
                    type="submit"
                    class="w-full bg-[#6F5685] text-white py-3.5 rounded-xl font-semibold hover:bg-[#59436D] transition">
                    Create Account
                </button>

            </form>


            <!-- Sign In Link -->
            <p class="text-center text-sm text-gray-600 mt-6">

                Already have an account?

                <a href="signin.html"
                   class="text-[#6F5685] font-semibold hover:underline">
                    Sign in
                </a>

            </p>

        </div>

    </div>

</section>
